[project]
name = "dtc-diagnostics-system"
version = "0.1.0"
description = "ADK-compatible Automotive Diagnostic Intelligence System with OEM Manual RAG, NHTSA Recall Lookup, and Warranty Triage."
requires-python = ">=3.11,<3.14"

dependencies = [
    "google-adk[gcp,otel-gcp,bigquery-analytics]>=2.12.0,<3.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "gcsfs>=2026.10.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-agentplatform[agent-engines]>=2.2.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=2.2.0,<3.0.0",
    "protobuf>=6.31.1,<7.0.0",
    "pydantic-settings>=2.2.0",
    "pypdf>=4.0.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "api", "retrieval", "ingest"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"
