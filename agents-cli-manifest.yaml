name: dtc-diagnostics-system
acli_version: 1.13.0
agent_directory: app
region: us-central1
base_template: adk_python
language: python
framework: google-adk
create_params:
  root_agent_name: dtc_diagnostics_agent
  app_name: app
  deployment_target: cloud_run
  session_type: in_memory
  is_a2a: true
  agent_gateway: false
  agent_runtime:
    identity_default: agent_identity
  cloud_run:
    identity_default: agent_identity
